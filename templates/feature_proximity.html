{% extends "feature_base.html" %}
{% block fhead %}{% include "_3dmol.html" %}{% endblock %}

{% block controls %}<div class="form-group"><label>Max 3D distance (Å)</label><input id="p-threshold" type="number" min="4" max="30" value="10"></div><div class="form-group"><label>Min sequence separation</label><input id="p-minsep" type="number" min="5" max="200" value="20"></div><div class="form-group"><label>Distance definition</label><select id="p-distmode"><option value="ca" selected>C-alpha to C-alpha</option><option value="min_atom">Closest atom pair</option></select></div><div class="form-group"><label>Min pLDDT</label><input id="p-plddt" type="number" min="0" max="100" step="1" value="70"></div><div class="form-group"><label>Permutations (0 = exact test only)</label><input id="p-nperm" type="number" min="0" max="20000" step="100" value="1000"></div><div class="form-group"><label>Random seed</label><input id="p-seed" type="number" min="0" max="2147483647" step="1" value="1"></div><div class="form-group wide"><label>cBioPortal cancer study (required)</label><input id="p-study" list="study-list" placeholder="e.g. brca_tcga"><datalist id="study-list"></datalist><span id="study-status" class="stat-note"></span></div>{% endblock %}
